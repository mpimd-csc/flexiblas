intel-oneapi-build:
        variables:
          USE_CCACHE: "OFF"
        stage: build-compiler
        image: gitlab.mpi-magdeburg.mpg.de/ci-images/intel-compiler/jammy:${INTEL_VERSION}
        tags:
            - haswell
        needs: []
        rules:
            - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
            - if: $CI_PIPELINE_SOURCE == "merge_request_event"
            - if: $CI_COMMIT_TAG
            - if: $CI_COMMIT_TITLE =~ /^\[ALL\].*/
            - if: $CI_COMMIT_BRANCH =~ /intel/
        parallel:
            matrix:
                - INTEL_VERSION:
                    - "2025"
                    - "2024"
                    - "2023"
                    - "2022"
                  INTEGER8: [ 'INTEGER8_ON', 'INTEGER8_OFF' ]

        script:
                - mkdir build
                - cd build
                - export INTEGER8=${INTEGER8##INTEGER8_}
                - CC=icx CXX=icpx FC=ifx cmake ../ -DDEV=ON -DDEBUG=ON -DINTEGER8=${INTEGER8}
                - make 2>&1 | tee build.log
                - OMP_NUM_THREADS=1 ctest  --output-on-failure

