default:
    interruptible: true
variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - checks
  - build

include: '/misc/cmake-runs.yml'

clang-format:
  stage: checks
  image: gitlab.mpi-magdeburg.mpg.de/ci-images/minimal/ubuntu:noble
  variables:
    GIT_AUTHOR_NAME: "$GITLAB_USER_NAME (via pipeline)"
    GIT_AUTHOR_EMAIL: $GITLAB_USER_EMAIL
    GIT_COMMITTER_NAME: "$GITLAB_USER_NAME (via pipeline)"
    GIT_COMMITTER_EMAIL: $GITLAB_USER_EMAIL
  script:
    - git ls-files "*.cpp" "*.c" "*.h"  |  grep -v "^contrib" | xargs clang-format -i
    - git add -A
    - git commit -m "Run clang-format" || echo "No changes to commit"
    - git remote set-url origin $CI_REPOSITORY_URL
    - git push origin HEAD:$CI_COMMIT_BRANCH


ubuntu:
  parallel:
    matrix:
      - UBUNTU_VERSION:
        - focal
        - jammy
        - noble
        - resolute
  stage: build
  image: gitlab.mpi-magdeburg.mpg.de/ci-images/minimal/ubuntu:${UBUNTU_VERSION}
  script:
    - apt update; apt install --yes git
    - apt-get install --yes cmake libhdf5-dev zlib1g-dev libbz2-dev liblzma-dev libzstd-dev
    - mkdir -p build
    - cd build
    - cmake ../ -DDEBUG=ON
    - make
    - make test

almalinux:
  tags:
    - haswell
  parallel:
    matrix:
      - ALMALINUX_VERSION:
        - "9"
        - "10"
  stage: build
  image: gitlab.mpi-magdeburg.mpg.de/ci-images/minimal/almalinux:${ALMALINUX_VERSION}
  script:
    - yum -y install hdf5-devel zlib-devel bzip2-devel xz-devel
    - mkdir -p build
    - cd build
    - cmake .. -DDEBUG=ON
    - make
    - make test

