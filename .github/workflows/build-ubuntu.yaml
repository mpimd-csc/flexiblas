name: build-ubuntu
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:

  ubuntu:
    # For available GitHub-hosted runners, see:
    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
    runs-on: ${{ matrix.os }}

    name: >-
      ${{ matrix.os }} (${{ matrix.cc }})
      ${{ matrix.integer8 && ' 64-bit' || '' }}
      ${{ matrix.links.link-blas && ' link-blas' || '' }}
      ${{ matrix.links.link-lapack && ' link-lapack' || '' }}
      ${{ matrix.links.link-cblas && ' link-cblas' || '' }}
      ${{ matrix.links.link-lapacke && ' link-lapacke' || '' }}
      ${{ matrix.defaultblas && format(' default={0}',matrix.defaultblas) || '' }}

    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false

      matrix:
        os: [ubuntu-latest,ubuntu-26.04-arm]
        compiler-pkgs: ["g++ gcc"]
        integer8: [1,0]
        cc: [gcc]
        defaultblas: [0]
        links:
          - link-blas: 0
          - link-blas: 1
            link-lapack: 1
          - link-blas: 1
            link-lapack: 1
            link-cblas: 1
            link-lapacke: 1
          # Building with Clang fails with a linker error:
          #   undefined reference to `csc_cycles'
          # Comment out for now.
          # - os: ubuntu-latest
          #   compiler-pkgs: "clang libomp-dev"
          #   cc: "clang"

    env:
      CC: ${{ matrix.cc }}

    steps:
      - name: get CPU information (Linux)
        if: runner.os == 'Linux'
        run: lscpu

      - name: set SYSTEM_CORES (Linux)
        shell: bash
        if: runner.os == 'Linux'
        run: echo SYSTEM_CORES="$(grep -c ^processor /proc/cpuinfo 2>/dev/null || echo 1 )" >> $GITHUB_ENV
      - name: set SYSTEM_CORES (macOS)
        shell: bash
        if: runner.os == 'macOS'
        run: echo SYSTEM_CORES="$(sysctl -n hw.ncpu || echo 1)" >> $GITHUB_ENV
      - name: set SYSTEM_CORES (Windows)
        shell: bash
        if: runner.os == 'Windows'
        run: echo SYSTEM_CORES=$( powershell -NoProfile -Command "& { Get-WmiObject Win32_Processor | Select-Object -Property NumberOfCores }" | perl -0777 -ne 'print $1, "\n" while /(\d+)/g' ) >> $GITHUB_ENV

      - name: checkout repository
        uses: actions/checkout@v7

      - name: install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt -qq update
          I8SUFFIX=${{ matrix.integer8 && '64' || '' }}
          sudo apt install -y ${{ matrix.compiler-pkgs }} gfortran cmake ccache \
            libblas$I8SUFFIX-dev liblapack$I8SUFFIX-dev \
            liblapacke$I8SUFFIX-dev libopenblas$I8SUFFIX-dev

      - name: prepare ccache
        # create key with human readable timestamp
        # used in action/cache/restore and action/cache/save steps
        id: ccache-prepare
        run: |
          echo "key=ccache:${{ matrix.os }}:${{ matrix.cc }}:${{ matrix.integer8 && '64' || '32' }}bit:${{ github.ref }}:$(date +"%Y-%m-%d_%H-%M-%S"):${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: restore ccache
        # setup the GitHub cache used to maintain the ccache from one job to the next
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-prepare.outputs.key }}
          # Prefer caches from the same branch. Fall back to caches from the dev branch.
          restore-keys: |
            ccache:${{ matrix.os }}:${{ matrix.cc }}:${{ matrix.integer8 && '64' || '32' }}bit:${{ github.ref }}:
            ccache:${{ matrix.os }}:${{ matrix.cc }}:${{ matrix.integer8 && '64' || '32' }}bit:

      - name: configure ccache
        run: |
          test -d ~/.ccache || mkdir ~/.ccache
          echo "max_size = 400M" >> ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          ccache -s
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: configure per-OS variable setup (Linux)
        if: runner.os == 'Linux'
        run: |
          I8SUFFIX=${{ matrix.integer8 && '64' || '' }}
          (
            echo "I8SUFFIX=$I8SUFFIX"
            echo "CI_LIB_BLAS=${{ matrix.links.link-blas && '$(dpkg -L libblas$I8SUFFIX-dev | grep "libblas$I8SUFFIX.so\$")' || '' }}"
            echo "CI_LAPACK_API=${{ matrix.links.link-lapack && '$(dpkg -s liblapack$I8SUFFIX-dev | perl -nE "say \$1 if /^Version: ([0-9.]+)/")' || '' }}"
            echo "CI_LIB_LAPACK=${{ matrix.links.link-lapack && '$(dpkg -L liblapack$I8SUFFIX-dev | grep "liblapack$I8SUFFIX.so\$")' || '' }}"
            echo "CI_LIB_CBLAS=${{ matrix.links.link-cblas && '$(dpkg -L libblas$I8SUFFIX-dev | grep "libblas$I8SUFFIX.so\$")' || '' }}"
            echo "CI_LIB_LAPACKE=${{ matrix.links.link-lapacke && '$(dpkg -L liblapacke$I8SUFFIX-dev | grep "liblapacke$I8SUFFIX.so\$")' || '' }}"
          ) >> "$GITHUB_ENV"

      - name: configure
        run: |
          cmake -B ${GITHUB_WORKSPACE}/build \
            -DCMAKE_BUILD_TYPE="Debug" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            ${{ matrix.integer8 && '-DINTEGER8=ON' || '' }} \
            ${{ matrix.links.link-blas && '-DSYS_BLAS_LIBRARY=$CI_LIB_BLAS' || '' }} \
            ${{ matrix.links.link-lapack && '-DLAPACK_API_VERSION=$CI_LAPACK_API' || '' }} \
            ${{ matrix.links.link-lapack && '-DSYS_LAPACK_LIBRARY=$CI_LIB_LAPACK' || '' }} \
            ${{ matrix.links.link-cblas && '-DSYS_CBLAS_LIBRARY=$CI_LIB_CBLAS' || '' }} \
            ${{ matrix.links.link-lapacke && '-DSYS_LAPACKE_LIBRARY=$CI_LIB_LAPACKE' || '' }} \
            ${{ matrix.defaultblas && format('-DFLEXIBLAS_DEFAULT_BLAS={0}$I8SUFFIX',matrix.defaultblas) || '' }} \

      - name: build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build -j$SYSTEM_CORES

      - name: ccache status
        continue-on-error: true
        run: ccache -s

      - name: save ccache
        # Save the cache after we are done (successfully) building
        # This helps to retain the ccache even if the subsequent steps are failing.
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-prepare.outputs.key }}

      - name: install
        run: |
          cmake --install ${GITHUB_WORKSPACE}/build

      - name: check
        id: run-ctest
        timeout-minutes: 150
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
          FLEXIBLAS_VERBOSE: 1
        run: |
          ctest --test-dir ${GITHUB_WORKSPACE}/build \
            -j$SYSTEM_CORES \
            --timeout 300 && RESULT=true || RESULT=false
          echo "::group::Log from these tests"
          [ -f Testing/Temporary/LastTest.log ] && cat Testing/Temporary/LastTest.log
          echo "::endgroup::"
          $RESULT
