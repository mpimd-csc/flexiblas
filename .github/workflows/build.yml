name: build
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  CI:
    # For available GitHub-hosted runners, see:
    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
    runs-on: ${{ matrix.os }}

    name: >-
      ${{ matrix.os }} (${{ matrix.cc }})
      ${{ matrix.integer8 && ' 64-bit' || '' }}
      ${{ matrix.links.link-blas && ' link-blas' || '' }}
      ${{ matrix.links.link-lapack && ' link-lapack' || '' }}
      ${{ matrix.links.link-cblas && ' link-cblas' || '' }}
      ${{ matrix.links.link-lapacke && ' link-lapacke' || '' }}
      ${{ matrix.defaultblas && format(' default={0}',matrix.defaultblas) || '' }}

    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false

      matrix:
        os: [ubuntu-latest,ubuntu-26.04-arm]
        compiler-pkgs: ["g++ gcc"]
        integer8: [1,0]
        cc: [gcc]
        defaultblas: [0]
        links:
          - link-blas: 0
          - link-blas: 1
            link-lapack: 1
          - link-blas: 1
            link-lapack: 1
            link-cblas: 1
            link-lapacke: 1
        include:
          - os: macos-latest
            integer8: 0
            links:
              link-blas: 1
              link-lapack: 1
              link-cblas: 1
              link-lapacke: 1
            cc: clang
            defaultblas: OpenBLASOpenMP
          - os: windows-latest
            links:
              link-blas: 1
              link-lapack: 1
              link-cblas: 1
              link-lapacke: 1
            cc: gcc
            defaultblas: OpenBLASOpenMP
          - os: ubuntu-26.04-arm
            integer8: 0
            links:
              link-blas: 1
              link-lapack: 1
              link-cblas: 1
              link-lapacke: 1
            compiler-pkgs: "g++ gcc"
            cc: gcc
            defaultblas: OpenBLASPThread
          - os: ubuntu-26.04-arm
            integer8: 1
            links:
              link-blas: 1
              link-lapack: 1
              link-cblas: 1
              link-lapacke: 1
            compiler-pkgs: "g++ gcc"
            cc: gcc
            defaultblas: OpenBLASPThread
          - os: ubuntu-26.04-arm
            links:
              link-blas: 1
              link-lapack: 1
              link-cblas: 1
              link-lapacke: 1
            compiler-pkgs: "clang flang libomp-dev"
            cc: "clang"
            fc: "flang"

    env:
      CC: ${{ matrix.cc }}
      FC: ${{ matrix.fc || 'gfortran' }}

    steps:
      - name: get CPU information (Linux)
        if: runner.os == 'Linux'
        run: lscpu
      - name: get CPU information (macOS)
        if: runner.os == 'macOS'
        run: sysctl -a | grep machdep.cpu
      - name: get CPU information (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run : |
          Get-PSDrive -PSProvider FileSystem
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name

      - name: set SYSTEM_CORES (Linux)
        if: runner.os == 'Linux'
        run: echo SYSTEM_CORES="$(grep -c ^processor /proc/cpuinfo 2>/dev/null || echo 1 )" >> $GITHUB_ENV
      - name: set SYSTEM_CORES (macOS)
        if: runner.os == 'macOS'
        run: echo SYSTEM_CORES="$(sysctl -n hw.ncpu || echo 1)" >> $GITHUB_ENV
      - name: set SYSTEM_CORES (Windows)
        if: runner.os == 'Windows'
        run: echo SYSTEM_CORES=$( powershell -NoProfile -Command "& { Get-WmiObject Win32_Processor | Select-Object -Property NumberOfCores }" | perl -0777 -ne 'print $1, "\n" while /(\d+)/g' ) >> $GITHUB_ENV

      - name: checkout repository
        uses: actions/checkout@v7

      - name: install dependencies, configure variables (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt -qq update
          I8SUFFIX=${{ matrix.integer8 && '64' || '' }}
          sudo apt install -y ${{ matrix.compiler-pkgs }} gfortran cmake ccache \
            libblas$I8SUFFIX-dev liblapack$I8SUFFIX-dev \
            liblapacke$I8SUFFIX-dev libopenblas$I8SUFFIX-dev
          (
            echo "I8SUFFIX=$I8SUFFIX"
            echo "CI_LIB_BLAS=${{ matrix.links.link-blas && '$(dpkg -L libblas$I8SUFFIX-dev | grep "libblas$I8SUFFIX.so\$")' || '' }}"
            echo "CI_LAPACK_API=${{ matrix.links.link-lapack && '$(dpkg -s liblapack$I8SUFFIX-dev | perl -nE "say \$1 if /^Version: ([0-9.]+)/")' || '' }}"
            echo "CI_LIB_LAPACK=${{ matrix.links.link-lapack && '$(dpkg -L liblapack$I8SUFFIX-dev | grep "liblapack$I8SUFFIX.so\$")' || '' }}"
            echo "CI_LIB_CBLAS=${{ matrix.links.link-cblas && '$(dpkg -L libblas$I8SUFFIX-dev | grep "libblas$I8SUFFIX.so\$")' || '' }}"
            echo "CI_LIB_LAPACKE=${{ matrix.links.link-lapacke && '$(dpkg -L liblapacke$I8SUFFIX-dev | grep "liblapacke$I8SUFFIX.so\$")' || '' }}"
          ) >> "$GITHUB_ENV"

      - name: install dependencies, configure variables (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gfortran cmake ccache lapack openblas
          (
            echo "CI_LIB_BLAS=${{ matrix.links.link-blas && '$(brew --prefix lapack)/lib/libblas.dylib' || '' }}"
            echo "CI_LAPACK_API=${{ matrix.links.link-lapack && '$(brew list --versions lapack | perl -nE "/([\d.]+)/ && say \$1")' || '' }}"
            echo "CI_LIB_LAPACK=${{ matrix.links.link-lapack && '$(brew --prefix lapack)/lib/liblapack.dylib' || '' }}"
            echo "CI_LIB_CBLAS=${{ matrix.links.link-cblas && '$(brew --prefix lapack)/lib/libcblas.dylib' || '' }}"
            echo "CI_LIB_LAPACKE=${{ matrix.links.link-lapacke && '$(brew --prefix lapack)/lib/liblapacke.dylib' || '' }}"
            echo "GENERATOR_FLAG=-DCMAKE_C_COMPILER_LAUNCHER=ccache"
          ) >> "$GITHUB_ENV"

      - name: install dependencies (MinGW)
        if: runner.os == 'Windows' && matrix.cc == 'gcc'
        env:
          MSYSTEM: UCRT64
          I8SUFFIX: ${{ matrix.integer8 && '64' || '' }}
          TRIPLET: mingw-w64-ucrt-x86_64
        shell: cmd
        # keep all at same indent else YAML preserves newlines
        run: >
          C:\msys64\usr\bin\bash.exe -leo pipefail -c "
          pacman -S --noconfirm --needed $TRIPLET-ccache
          $TRIPLET-gcc $TRIPLET-gcc-fortran
          $TRIPLET-cmake $TRIPLET-ninja $TRIPLET-dlfcn
          $TRIPLET-openblas$I8SUFFIX
          $TRIPLET-cblas$I8SUFFIX $TRIPLET-lapack$I8SUFFIX
          $TRIPLET-lapacke$I8SUFFIX
          " &&
          echo C:\msys64\ucrt64\bin>> "%GITHUB_PATH%"

      - name: configure per-OS variable setup (MinGW)
        if: runner.os == 'Windows' && matrix.cc == 'gcc'
        env:
          I8SUFFIX: ${{ matrix.integer8 && '64' || '' }}
          TRIPLET: mingw-w64-ucrt-x86_64
        run: |
          GCC_BIN="$(dirname "$(which gcc)")"
          PREFIX_WIN="$(cygpath -m "$(dirname "$GCC_BIN")")"
          (
            echo "I8SUFFIX=$I8SUFFIX"
            echo "GENERATOR_FLAG=-G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache"
            cygpath -w "$GCC_BIN" >> "$GITHUB_PATH"
            echo "CI_LIB_BLAS=${{ matrix.links.link-blas && '${PREFIX_WIN}/lib/libblas$I8SUFFIX.dll.a' || '' }}"
            echo "CI_LAPACK_API=${{ matrix.links.link-lapack && '$(/c/msys64/usr/bin/pacman.exe -Q "$TRIPLET-lapack$I8SUFFIX" | perl -pe "s#.* (.*)-.*#\$1#")' || '' }}"
            echo "CI_LIB_LAPACK=${{ matrix.links.link-lapack && '${PREFIX_WIN}/lib/liblapack$I8SUFFIX.dll.a' || '' }}"
            echo "CI_LIB_CBLAS=${{ matrix.links.link-cblas && '${PREFIX_WIN}/lib/libcblas$I8SUFFIX.dll.a' || '' }}"
            echo "CI_LIB_LAPACKE=${{ matrix.links.link-lapacke && '${PREFIX_WIN}/lib/liblapacke$I8SUFFIX.dll.a' || '' }}"
          ) >> "$GITHUB_ENV"

      - name: restore ccache
        # setup the GitHub cache used to maintain the ccache from one job to the next
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          # ensure is same as "save ccache" step
          key: ccache:${{ matrix.os }}:${{ matrix.cc }}:${{ matrix.integer8 && '64' || '32' }}bit:${{ github.ref }}:${{ github.sha }}
          # Prefer caches from the same branch. Fall back to caches from the dev branch.
          restore-keys: |
            ccache:${{ matrix.os }}:${{ matrix.cc }}:${{ matrix.integer8 && '64' || '32' }}bit:${{ github.ref }}:
            ccache:${{ matrix.os }}:${{ matrix.cc }}:${{ matrix.integer8 && '64' || '32' }}bit:

      - name: configure ccache
        run: |
          test -d ~/.ccache || mkdir ~/.ccache
          echo "max_size = 400M" >> ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          ccache -s
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: configure
        run: |
          cmake -B ${GITHUB_WORKSPACE}/build $GENERATOR_FLAG \
            -DCMAKE_BUILD_TYPE="Debug" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            ${{ matrix.integer8 && '-DINTEGER8=ON' || '' }} \
            ${{ matrix.links.link-blas && '-DSYS_BLAS_LIBRARY=$CI_LIB_BLAS' || '' }} \
            ${{ matrix.links.link-lapack && '-DLAPACK_API_VERSION=$CI_LAPACK_API' || '' }} \
            ${{ matrix.links.link-lapack && '-DSYS_LAPACK_LIBRARY=$CI_LIB_LAPACK' || '' }} \
            ${{ matrix.links.link-cblas && '-DSYS_CBLAS_LIBRARY=$CI_LIB_CBLAS' || '' }} \
            ${{ matrix.links.link-lapacke && '-DSYS_LAPACKE_LIBRARY=$CI_LIB_LAPACKE' || '' }} \
            ${{ matrix.defaultblas && format('-DFLEXIBLAS_DEFAULT_BLAS={0}$I8SUFFIX',matrix.defaultblas) || '' }} \
            && RESULT=true || RESULT=false
          echo "::group::Log from the configure"
          cat ${GITHUB_WORKSPACE}/build/CMakeFiles/CMakeConfigureLog.yaml
          echo "::endgroup::"
          $RESULT

      - name: build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build -j$SYSTEM_CORES

      - name: ccache status
        continue-on-error: true
        run: ccache -s

      - name: save ccache
        # Save the cache after we are done (successfully) building
        # This helps to retain the ccache even if the subsequent steps are failing.
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          # ensure is same as "restore ccache" step
          key: ccache:${{ matrix.os }}:${{ matrix.cc }}:${{ matrix.integer8 && '64' || '32' }}bit:${{ github.ref }}:${{ github.sha }}

      - name: install
        run: |
          cmake --install ${GITHUB_WORKSPACE}/build

      - name: check
        id: run-ctest
        timeout-minutes: 150
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
          FLEXIBLAS_VERBOSE: 1
        run: |
          ctest --test-dir ${GITHUB_WORKSPACE}/build \
            -j$SYSTEM_CORES \
            --timeout 300 && RESULT=true || RESULT=false
          echo "::group::Log from these tests"
          cat ${GITHUB_WORKSPACE}/build/Testing/Temporary/LastTest.log
          echo "::endgroup::"
          $RESULT
